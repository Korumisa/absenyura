name: Availability Monitor

on:
  schedule:
    # Reduce Vercel cold starts; Hobby Vercel Cron is once/day so GHA owns the interval.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Check readiness and alert on degradation
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node scripts/monitor-availability.mjs
      - name: Sync session statuses
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node --input-type=module -e "const url=new URL('/api/cron/trigger?job=session', process.env.APP_URL); const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CRON_SECRET},redirect:'error',signal:AbortSignal.timeout(25000)}); console.log(JSON.stringify({type:'session_cron',status:r.status})); if(!r.ok) process.exit(1);"
