name: Session cron backup

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger-session-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger session status sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL dan CRON_SECRET harus diset di repository secrets"
            exit 1
          fi
          url="${APP_URL%/}/api/cron/trigger?job=session&key=${CRON_SECRET}"
          code=$(curl -sS -o /tmp/cron-body.txt -w "%{http_code}" "$url")
          echo "HTTP $code"
          cat /tmp/cron-body.txt
          test "$code" = "200"
