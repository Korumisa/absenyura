name: Daily cron backup (nonce/photo cleanup + semester sync)

on:
  schedule:
    # 01:00 UTC daily, matches Vercel cron schedule in vercel.json.
    # +5min jitter to avoid thundering herd on the dot (added in logic below).
    - cron: '5 1 * * *'
  workflow_dispatch:

jobs:
  trigger-daily-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily cron (cleanup nonces, orphan photos, semester updates)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL dan CRON_SECRET harus diset di repository secrets (sama dengan session-cron.yml)"
            exit 1
          fi

          # Jitter 0-60 detik supaya tidak tabrakan tepat di menit 01:05 dengan trigger lain.
          sleep $(( RANDOM % 60 ))

          url="${APP_URL%/}/api/cron/trigger?job=daily"
          echo "Pinging: $url"
          code=$(curl -sS -o /tmp/cron-daily-body.txt -w "%{http_code}" -H "X-Cron-Secret: ${CRON_SECRET}" "$url")
          echo "HTTP $code"
          cat /tmp/cron-daily-body.txt

          if [ "$code" != "200" ]; then
            echo
            echo "❌ Daily cron GAGAL (HTTP $code). Lihat: aplikasi log / vercel.com logs untuk detail."
            echo "Pemicu cadangan jika Vercel cron diam (Hobby plan behavior): jalankan via Settings → Actions → Workflow dispatch"
            exit 1
          fi
