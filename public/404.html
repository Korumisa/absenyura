<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, nosnippet, noarchive" />
    <title>404 — Halaman Tidak Ditemukan | E-Absensi</title>
    <meta name="description" content="Halaman yang Anda cari tidak ditemukan atau sudah dipindahkan." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --brand-50: #eff6ff;
        --brand-100: #dbeafe;
        --brand-500: #3b82f6;
        --brand-600: #2563eb;
        --brand-700: #1d4ed8;
        --ink-50: #f8fafc;
        --ink-200: #e2e8f0;
        --ink-500: #64748b;
        --ink-700: #334155;
        --ink-900: #0f172a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(180deg, var(--brand-50) 0%, #ffffff 60%);
        color: var(--ink-900);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border: 1px solid var(--ink-200);
        border-radius: 20px;
        box-shadow: 0 20px 50px -20px rgba(37, 99, 235, 0.18);
        padding: 40px 32px;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        display: block;
        border-radius: 16px;
      }
      .code {
        font-size: 72px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--brand-600), var(--brand-700));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin: 12px 0 4px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 8px 0 8px;
        color: var(--ink-900);
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink-500);
        margin: 0 0 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--brand-600);
        color: #ffffff;
        padding: 12px 22px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.05s ease;
        will-change: transform;
      }
      .btn:hover { background: var(--brand-700); }
      .btn:active { transform: translateY(1px); }
      .home-link {
        display: inline-block;
        margin-top: 14px;
        font-size: 13px;
        color: var(--ink-500);
        text-decoration: none;
      }
      .home-link:hover { color: var(--brand-600); text-decoration: underline; }
      @media (min-width: 640px) {
        .card { padding: 48px 40px; }
        .code { font-size: 84px; }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <img class="logo" src="/logo-hmsdp.webp" alt="Logo HM SDP Undiksha" onerror="this.onerror=null;this.src='/logo-hmsdp.png';" />
      <div class="code" aria-label="Kode status 404">404</div>
      <h1>Halaman Tidak Ditemukan</h1>
      <p>
        Alamat yang Anda tuju tidak tersedia, sudah dipindahkan, atau mungkin salah ketik.
        Silakan kembali ke halaman utama atau periksa kembali URL yang dituju.
      </p>
      <a class="btn" href="/" aria-label="Kembali ke halaman utama">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12l9-9 9 9" />
          <path d="M5 10v10h14V10" />
        </svg>
        Kembali ke Beranda
      </a>
      <a class="home-link" href="/berita">Lihat berita terbaru &rarr;</a>
    </main>
  </body>
</html>
