# PostgreSQL Client Authentication Configuration File — HARDENED
# ===========================================================================
# Replace default:
#   sudo cp deploy/selfhost/security/pg_hba.conf /etc/postgresql/16/main/pg_hba.conf
#   sudo chown postgres:postgres /etc/postgresql/16/main/pg_hba.conf
#   sudo chmod 640 /etc/postgresql/16/main/pg_hba.conf
#   sudo pg_ctlcluster 16 main reload
#
# Verifikasi:
#   sudo -u postgres psql -c "SELECT 1;"  -> OK (local trust postgres superuser)
#   psql -h 127.0.0.1 -U hmsdp_app hmsdp  -> OK (PASSWORD REQUIRED scram-sha-256)
#   psql -h <IP_PUBLIK_VPS> -U hmsdp_app hmsdp  -> CONNECTION REFUSED (karena UFW deny + listen 127.0.0.1)
# ===========================================================================
# METHOD (column terakhir):
#   trust   = tanpa password — HANYA untuk user postgres local socket.
#   scram-sha-256 = WAJIB password encrypted SCRAM (postgresql.conf password_encryption=scram-sha-256)
#   reject  = DITOLAK MENTERA
# ===========================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# ===== 1. Superuser postgres LOCAL UNIX DOMAIN SOCKET: TRUST =====
#          Hanya bisa pakai jika user proses = postgres (via sudo -u postgres)
local   all             postgres                                peer map=pg_peer_to_postgres

# ===== 2. Aplikasi hmsdp_app — HANYA loopback 127.0.0.1 / ::1 =====
#          PASSWORD WAJIB. Semua koneksi luar VPS sudah DROP UFW,
#          TAPI kita triple guard disini juga reject semua subnet lain.
hostssl hmsdp           hmsdp_app       127.0.0.1/32            scram-sha-256 clientcert=verify-ca
host    hmsdp           hmsdp_app       127.0.0.1/32            scram-sha-256
hostssl hmsdp           hmsdp_app       ::1/128                 scram-sha-256 clientcert=verify-ca
host    hmsdp           hmsdp_app       ::1/128                 scram-sha-256

# ===== 3. hmsdp_app local unix socket (node.js connect host=/var/run/postgresql) =====
local   hmsdp           hmsdp_app                               scram-sha-256

# ===== 4. Replication: DISABLE di single node VPS (tidak ada slave) =====
local   replication     postgres                                reject
host    replication     all             127.0.0.1/32            reject
host    replication     all             ::1/128                 reject

# ===== 5. DROP RULE: REJECT SEMUA IP SELAIN LOOPBACK (Benteng terakhir sebelum UFW) =====
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject

# ===== 6. Local unix socket selain hmsdp_app / postgres = REJECT =====
local   all             all                                     reject
