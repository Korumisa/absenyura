# =============================================================================
# systemd drop-in override: postgresql@16-main.service — Resource Isolation
# =============================================================================
# Install (root):
#   mkdir -p /etc/systemd/system/postgresql@16-main.service.d
#   cp deploy/security/postgresql-16-main-override.conf \
#      /etc/systemd/system/postgresql@16-main.service.d/override.conf
#   systemctl daemon-reload
#   systemctl restart postgresql@16-main.service
#
# Verifikasi:
#   systemctl cat postgresql@16-main.service | tail -30
#   cat /proc/$(pgrep -f 'postgres: writer' | head -1)/oom_score_adj    # harus -900
# =============================================================================
[Service]
# — OOM protection (Postgres DIUTAMAKAN daripada Node.js app)
#   Range oom_score_adj: -1000 ... 1000
#   -1000 = "TIDAK BOLEH di-KILL kernel OOM apapun kondisinya"
#   -900  = Sangat kecil kemungkinan di-kill (Node.js PM2 punya score 0 default)
OOMScoreAdjust=-900

# — Memory upper bound (lebih rendah dari MemoryMax agar graceful throttle,
#   bukan OOM kill instan). 8 GB shared → 3,2 GB untuk shared_buffers + bgwriter
#   + maintenance_work_mem + work_mem burst.
MemoryHigh=3200M
MemoryMax=3500M
MemoryAccounting=yes

# — CPU nice priority — Postgres writer WAL harus diprioritaskan di atas Node.js.
#   Nice range: -20 (paling tinggi) ... +19 (paling rendah)
#   Postgres -5, Node.js PM2 default 0 → writer menang scheduling CPU contention 2 vCPU
Nice=-5
IOSchedulingClass=1
IOSchedulingPriority=0

# — Hardening
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/postgresql /var/log/postgresql /var/run/postgresql /tmp
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
LockPersonality=yes
MemoryDenyWriteExecute=no     # NO — PostgreSQL shared_buffers butuh write execute JIT
RestrictRealtime=yes
RestrictSUIDSGID=yes
PrivateDevices=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service @pkey @resources @chown
SystemCallErrorNumber=EPERM

# — Restart policy — jika main process exit code non-zero, auto-restart.
Restart=on-failure
RestartSec=15s
TimeoutStopSec=120s          # Postgres butuh waktu panjang checkpoint saat shutdown
