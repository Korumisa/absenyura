# Nginx vhost — HM SDP E-Absensi (VPS + Supabase)
#
# Pasang (ganti hmsdp.me jika memakai domain lain):
#   sudo cp deploy/nginx/hmsdp.conf /etc/nginx/sites-available/hmsdp.conf
#   sudo sed -i 's/hmsdp\.me/DOMAIN-ANDA/g' /etc/nginx/sites-available/hmsdp.conf   # opsional
#   sudo ln -sf /etc/nginx/sites-available/hmsdp.conf /etc/nginx/sites-enabled/hmsdp.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hmsdp.me -d www.hmsdp.me --redirect
#
# Sengaja hanya blok port 80: certbot yang menambah blok 443 + sertifikat + redirect.
# Header keamanan (HSTS, CSP, Permissions-Policy camera=(self)) dikirim oleh app —
# jangan tambah add_header keamanan di sini (header ganda bisa memblokir kamera scan QR).

server {
    listen 80;
    listen [::]:80;
    server_name hmsdp.me www.hmsdp.me;

    server_tokens off;
    client_max_body_size 12M;   # body JSON 10 MB + multipart foto <= 5 MB
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/manifest+json image/svg+xml;

    access_log /var/log/nginx/hmsdp-access.log;
    error_log  /var/log/nginx/hmsdp-error.log warn;

    # Express melayani dist/ (SPA), /api/* dan /uploads/* sekaligus.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
